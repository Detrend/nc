name: CI

on:
  push:
    branches: [main, gds-2026]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 20.1.8

jobs:
  build-win:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    strategy:
      fail-fast: false
      matrix:
        config: [Ship, Test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: choco upgrade llvm --version=${{ env.LLVM_VERSION }} --allow-downgrade -y --no-progress

      - name: Use the standalone LLVM toolchain
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\LLVM\bin' -Encoding utf8

      - name: Report toolchain versions
        run: |
          clang --version
          ninja --version
          tools\premake5.exe --version

      - name: Generate build files
        run: tools\premake5.exe --cc=clang --cppdialect=C++23 ninja

      - name: Build ${{ matrix.config }}
        run: ninja -C build ${{ matrix.config }}

      - name: Stage package
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item -Path bin\Nuclidean_${{ matrix.config }}\Nuclidean.exe -Destination staging\
          Copy-Item -Path content -Destination staging\content -Recurse

      - name: Create archive
        run: Compress-Archive -Path staging\* -DestinationPath nuclidean-${{ matrix.config }}-win64.zip

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: nuclidean-${{ matrix.config }}-win64
          path: nuclidean-${{ matrix.config }}-win64.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        config: [Ship, Test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Prerequisites
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends clang ninja-build libsdl2-dev zip
          chmod 777 ./tools/premake5

      - name: Report toolchain versions
        run: |
          clang --version
          ninja --version
          ./tools/premake5 --version

      - name: Generate build files
        run: ./tools/premake5 --cc=clang --cppdialect=C++20 ninja

      - name: Build ${{ matrix.config }}
        run: ninja -C build ${{ matrix.config }}

      - name: Stage package
        run: |
          mkdir -p staging
          cp bin/Nuclidean_${{ matrix.config }}/Nuclidean staging/
          cp -r content staging/content

      - name: Create archive
        run: zip -r nuclidean-${{ matrix.config }}-linux64.zip staging

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: nuclidean-${{ matrix.config }}-linux64
          path: nuclidean-${{ matrix.config }}-linux64.zip
          if-no-files-found: error

  trybuild-linux-gcc:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        config: [Ship]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Prerequisites
        run: |
          sudo apt update -y
          sudo apt install -y  --no-install-recommends g++ ninja-build libsdl2-dev zip
          chmod 777 ./tools/premake5

      - name: Report toolchain versions
        run: |
          g++ --version
          ninja --version
          ./tools/premake5 --version

      - name: Generate build files
        run: ./tools/premake5 --cc=gcc --cppdialect=C++23 ninja

      - name: Build ${{ matrix.config }}
        run: ninja -C build ${{ matrix.config }}

  trybuild-vs:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config: [Ship]
        compiler: [msc, clang]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate build files
        run: tools\premake5.exe --cc=${{ matrix.compiler }} --cppdialect=C++23 vs2026

      - name: Build ${{ matrix.config }}
        run: msbuild build\Nuclidean.slnx -p:Configuration=${{ matrix.config }} -p:Platform=x64 -m

  clang-tidy:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: choco upgrade llvm --version=${{ env.LLVM_VERSION }} --allow-downgrade -y --no-progress

      - name: Use the standalone LLVM toolchain
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\LLVM\bin' -Encoding utf8

      - name: Report toolchain versions
        run: |
          clang-tidy --version
          python --version

      - name: Generate compile database
        run: tools\premake5.exe compilecommands --cc=clang --cppdialect=C++23 --cc-config=Debug --cc-output=build/compile_commands.json

      - name: Run clang-tidy
        run: python 'C:\Program Files\LLVM\bin\run-clang-tidy' -p build -quiet -warnings-as-errors=* source.nuclidean

  check-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install glslang
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Compile shaders
        run: |
          status=0
          while IFS= read -r shader; do
            echo "$shader"
            output=$({ printf '#version 430 core\n#line 1\n'; cat "$shader"; } \
              | glslangValidator --stdin -S "${shader##*.}" 2>&1) || status=1
            case $output in *WARNING:*) status=1 ;; esac
            if [ -n "$output" ]; then echo "$output"; fi
          done < <(find content/shaders -type f \( -name '*.vert' -o -name '*.frag' -o -name '*.comp' \) | sort)
          exit $status

      - name: Check shaders referenced from the source exist
        run: |
          missing=$(grep -oP '_FILE\s*=\s*"\K[^"]+' source/nuclidean/engine/graphics/shaders/shaders.h \
            | sort -u | while read -r path; do [ -f "content/shaders/$path" ] || echo "$path"; done)
          if [ -n "$missing" ]; then
            echo "shaders.h references files that do not exist in content/shaders:"
            echo "$missing"
            exit 1
          fi

      - name: Check declared sounds exist
        run: |
          missing=$(comm -23 \
            <(grep -oP '^\s*xx\(\K[a-z_0-9]+' source/nuclidean/engine/sound/sound_resources.h | sort) \
            <(find content/sound -name '*.wav' -exec basename {} .wav \; | sort))
          if [ -n "$missing" ]; then
            echo "NC_SOUNDS declares sounds with no matching .wav in content/sound:"
            echo "$missing"
            exit 1
          fi

      - name: Check levels parse
        run: |
          for level in content/levels/*.json; do
            python3 -c 'import json, sys; json.load(open(sys.argv[1]))' "$level" \
              || { echo "invalid JSON: $level"; exit 1; }
          done

  unit-tests:
    needs: build-win
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download the Test archive
        uses: actions/download-artifact@v4
        with:
          name: nuclidean-Test-win64

      - name: Unpack
        run: Expand-Archive -Path nuclidean-Test-win64.zip -DestinationPath test_build

      - name: Run unit tests
        working-directory: test_build
        run: .\Nuclidean.exe -unit_test

  push-artifacts:
    needs: [build-win, build-linux, unit-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/gds-2026'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: push-artifacts
      cancel-in-progress: false

    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: nuclidean-*-*64    # match both win64 and linux64
          merge-multiple: true
          path: artifacts

      - name: Replace the autobuild release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SUFFIX: ${{ github.ref_name != 'main' && '-gds' || '' }}
        run: |
          gh release delete "autobuild$RELEASE_SUFFIX" --yes --cleanup-tag || true
          gh release create "autobuild$RELEASE_SUFFIX" artifacts/*.zip \
            --target "$GITHUB_SHA" \
            --title "Automated build$RELEASE_SUFFIX" \
            --notes "Built from ${GITHUB_SHA} on $(date -u '+%Y-%m-%d %H:%M UTC')." \
            --prerelease

  notify-failure:
    needs: [build-win, build-linux, trybuild-linux-gcc, trybuild-vs, clang-tidy, check-assets, unit-tests, push-artifacts]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Discord ID table
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/discord-ids.json
          sparse-checkout-cone-mode: false

      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.FAIL_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Fall back to an empty table if the file is missing or not valid JSON,
          # so a broken table never suppresses the failure notification.
          ids=$(jq -c . .github/discord-ids.json 2>/dev/null || echo '{}')
          jq -n --argjson ids "$ids" --arg actor "$GITHUB_ACTOR" \
            --arg ref "$GITHUB_REF_NAME" --arg sha "${GITHUB_SHA::7}" --arg url "$RUN_URL" '
            $ids[$actor] as $id
            | {content: "❌ **Autobuild failed** on `\($ref)` (\($sha)) by \(if $id then "<@\($id)>" else $actor end)\n\($url)",
               allowed_mentions: {users: (if $id then [$id] else [] end)}}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK_URL"
